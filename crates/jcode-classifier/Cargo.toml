[package]
name = "jcode-classifier"
version = "0.1.0"
edition = "2024"
description = "AI-assisted permission classification for jcode"
publish = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Provider integration
jcode-provider-core = { path = "../jcode-provider-core" }
jcode-message-types = { path = "../jcode-message-types" }

# Config types
jcode-config-types = { path = "../jcode-config-types" }

# Utilities
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

# Test files live under src/ (historical layout) and reference the public API,
# so they are registered explicitly rather than auto-discovered.
[[test]]
name = "stages_tests"
path = "src/stages_tests.rs"

[[test]]
name = "decision_tests"
path = "src/decision_tests.rs"
